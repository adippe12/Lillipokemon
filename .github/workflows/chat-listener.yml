# LILLIPEDEX stopgap chat listener.
# Public repo => Actions minutes are free and unlimited.
# Every 5 minutes (GitHub's minimum), a runner listens to #lillimon_ chat for
# ~4 minutes and reports spotted species to Supabase. It is NOT a perfect 24/7
# listener (windows can start late and messages inside gaps are missed); it is
# the safety net until the Cloudflare Durable Object listener
# (ops/listener/) is deployed with `scripts/deploy_listener.sh`.
name: chat-listener

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: chat-listener
  cancel-in-progress: true

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Listen to Twitch chat
        run: bun ops/listener/src/gh_run.ts
        env:
          # Public by design: same anon key baked into the static site bundle.
          SUPABASE_URL: "https://wzptdnwcnshdxwzsjyzb.supabase.co"
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cHRkbndjbnNoZHh3enNqeXpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxNTYxMzQsImV4cCI6MjA3NzczMjEzNH0.-TR5U-dfcRCzBjgmlRJuP_XO6eRwYPS151JAWKGR5y8"
          LISTEN_MS: "250000"
